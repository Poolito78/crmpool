# Base « CRMsignalise », la même que celle déployée sur Vercel.
project_id = "qkjxcfosutclnahvxflf"

[functions.analyze-email]
verify_jwt = false

[functions.odoo-prix]
verify_jwt = false

# Ecriture dans Odoo : reservee aux sessions authentifiees.
[functions.odoo-devis]
verify_jwt = true

[functions.odoo-stock-sync]
verify_jwt = true

# Achats : lignes d un devis fournisseur rapprochees d Odoo, en LECTURE seule.
# Session exigee (catalogue et fichier partenaires).
[functions.odoo-achat]
verify_jwt = true

# Relais Gemini : la cle vit cote serveur, l'acces exige une session MonCRM.
# Un relais ouvert offrirait a tout venant un acces Gemini facture au
# proprietaire de la cle — c'est exactement ce que la cle publique permettait.
[functions.gemini]
verify_jwt = true

# Agent mail : reçoit les mails transférés, postés par Postmark Inbound, qui
# n'a pas de session MonCRM. Protégé par la clé de l'adresse (+clé@) et, s'il
# est posé, le secret AGENT_MAIL_SECRET (?s= dans l'URL du webhook).
[functions.agent-mail-depot]
verify_jwt = false
